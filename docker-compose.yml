services:
  web:
    build: .
    image: bookshelf:3.2.0-local
    init: true
    restart: unless-stopped
    command: npm run start
    env_file: [.env]
    environment:
      BOOKSHELF_DB_PATH: /data/bookshelf.sqlite
      BOOKSHELF_DATA_DIR: /data
      BOOKSHELF_LEGACY_DATA_DIR: /data/legacy
    ports:
      - "${SERVER_PORT:-25647}:25647"
    volumes:
      - bookshelf-data:/data
  worker:
    build: .
    image: bookshelf:3.2.0-local
    init: true
    restart: unless-stopped
    command: npm run worker
    healthcheck:
      disable: true
    env_file: [.env]
    environment:
      BOOKSHELF_DB_PATH: /data/bookshelf.sqlite
      BOOKSHELF_DATA_DIR: /data
      BOOKSHELF_LEGACY_DATA_DIR: /data/legacy
    volumes:
      - bookshelf-data:/data
    depends_on:
      web:
        condition: service_healthy
volumes:
  bookshelf-data:
