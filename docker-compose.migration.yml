services:
  migration:
    build:
      context: .
      dockerfile: Dockerfile.migration
    image: bookshelf:migration-bridge-local
    init: true
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "25647:25647"
      - "25648:25648"
    volumes:
      - ./data:/data
      - ./next/data:/app/next/data
