# Existing ca2 Docker installation: reuse the migrated volume, never create an empty replacement.
# Pin the stable image; BOOKSHELF_IMAGE can select another verified version.
services:
  permissions:
    image: ${BOOKSHELF_IMAGE:-trstyq/bookshelf:3.4.0}
    user: "0:0"
    restart: "no"
    network_mode: none
    entrypoint: ["node", "scripts/prepare-data-permissions.mjs"]
    volumes:
      - bookshelf-data:/data
      - legacy-data:/data/legacy
  web:
    image: ${BOOKSHELF_IMAGE:-trstyq/bookshelf:3.4.0}
    init: true
    restart: unless-stopped
    command: npm run start
    env_file: [.env]
    environment:
      BOOKSHELF_DB_PATH: /data/bookshelf.sqlite
      BOOKSHELF_DATA_DIR: /data
      BOOKSHELF_LEGACY_DATA_DIR: /data/legacy
    ports:
      - "${SERVER_PORT:-25647}:25647"
    volumes:
      - bookshelf-data:/data
      - legacy-data:/data/legacy
    depends_on:
      permissions:
        condition: service_completed_successfully
  worker:
    image: ${BOOKSHELF_IMAGE:-trstyq/bookshelf:3.4.0}
    init: true
    restart: unless-stopped
    command: npm run worker
    env_file: [.env]
    environment:
      BOOKSHELF_DB_PATH: /data/bookshelf.sqlite
      BOOKSHELF_DATA_DIR: /data
      BOOKSHELF_LEGACY_DATA_DIR: /data/legacy
    healthcheck:
      disable: true
    volumes:
      - bookshelf-data:/data
    depends_on:
      web:
        condition: service_healthy
volumes:
  bookshelf-data:
    external: true
    name: ${BOOKSHELF_DATA_VOLUME:-${BOOKSHELF_NEXT_VOLUME:-Bookshelf-next}}
  legacy-data:
    external: true
    name: ${BOOKSHELF_LEGACY_VOLUME:-Bookshelf}
